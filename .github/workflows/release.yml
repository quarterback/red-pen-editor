name: Release and publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # MCP Registry login through GitHub OIDC
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check versions match the tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          for f in package.json manifest.json server.json; do
            test "$(jq -r .version "$f")" = "$V" || { echo "$f version does not match tag $GITHUB_REF_NAME"; exit 1; }
          done
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Build MCP bundle
        run: |
          mkdir -p stage dist
          cp -R manifest.json package.json README.md LICENSE bin src stage/
          npx -y @anthropic-ai/mcpb validate stage/manifest.json
          npx -y @anthropic-ai/mcpb pack stage "dist/red-pen-editor-${VERSION}.mcpb"
          SHA=$(sha256sum "dist/red-pen-editor-${VERSION}.mcpb" | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          jq --arg sha "$SHA" '.packages[0].fileSha256 = $sha' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate registry record
        run: ./mcp-publisher validate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/red-pen-editor-${VERSION}.mcpb" \
            --title "Red Pen Editor ${VERSION}" \
            --notes "MCP bundle for Red Pen Editor ${VERSION}. SHA-256: ${SHA}"

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

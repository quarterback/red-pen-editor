name: Release and publish

# Run from the Actions tab ("Run workflow"), or by pushing a v* tag.
# The version comes from package.json; manifest.json and server.json must match it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and GitHub release
      id-token: write   # MCP Registry login and npm provenance through GitHub OIDC
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check versions
        run: |
          V="$(jq -r .version package.json)"
          for f in manifest.json server.json; do
            test "$(jq -r .version "$f")" = "$V" || { echo "$f version does not match package.json ($V)"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Build MCP bundle
        run: |
          mkdir -p stage dist
          cp -R manifest.json package.json README.md LICENSE bin src stage/
          npx -y @anthropic-ai/mcpb validate stage/manifest.json
          npx -y @anthropic-ai/mcpb pack stage "dist/red-pen-editor-${VERSION}.mcpb"
          SHA=$(sha256sum "dist/red-pen-editor-${VERSION}.mcpb" | cut -d' ' -f1)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          jq --arg sha "$SHA" '.packages[0].fileSha256 = $sha' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate registry record
        run: ./mcp-publisher validate

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: |
          if npm view "red-pen-editor@${VERSION}" version >/dev/null 2>&1; then
            echo "red-pen-editor@${VERSION} is already on npm; skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Rerun: replace the bundle so its hash matches the server.json built in this run.
            gh release upload "$TAG" "dist/red-pen-editor-${VERSION}.mcpb" --clobber
            exit 0
          fi
          gh release create "$TAG" "dist/red-pen-editor-${VERSION}.mcpb" \
            --target "$GITHUB_SHA" \
            --title "Red Pen Editor ${VERSION}" \
            --notes "MCP bundle for Red Pen Editor ${VERSION}. SHA-256: ${SHA}"

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
